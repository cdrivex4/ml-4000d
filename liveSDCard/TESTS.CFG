# ==============================================================================
# Canon EOS 4000D / Rebel T100 Autoboot Modular Diagnostic Configuration
# Place this file in W:\ (SD Card Root) to control on-camera diagnostics
# ==============================================================================
[DIAGNOSTICS]
# 1 = Run full automated hardware probe tree during autoboot
RUN_DIAG_TREE=1

# 1 = Draw direct high-contrast colored test bar to active VRAM
VRAM_DRAW_TEST=1

# 1 = Explicitly trigger Canon TurnOnDisplay() (0xFE0CD740)
FORCE_DISPLAY_ON=1

# 1 = Pass all button & GUI events unconditionally to Canon firmware
PASS_THROUGH_ALL=1

# 1 = Open ML menu on [Q], [DISP], or [Av] button press
ALLOW_MENU_SHORTCUTS=1
